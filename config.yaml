    #   ai_stats_dir: "dummy_method_ai_statistics"
    #   ai_viz_dir: "dummy_method_ai_viz"

  # --------------------------------------------------------------------------
  # Output subdirectories (relative to output_root/expert-novice/)
  # --------------------------------------------------------------------------
  output_subdirs:
    roi_signals:          "expert-novice/roi_signals"
    phase_1_raw:          "expert-novice/phase_1_bivariate_dspte/te_raw"
    phase_1_connectivity: "expert-novice/phase_1_bivariate_dspte/te_connectivity"
    phase_1_codebook:     "expert-novice/phase_1_bivariate_dspte/codebook"
    phase_1_group:        "expert-novice/phase_1_bivariate_dspte/group"
    phase_1_statistics:   "expert-novice/phase_1_bivariate_dspte/statistics"
    phase_1_viz:          "expert-novice/phase_1_bivariate_dspte/visualizations"
    phase_2_connectivity: "expert-novice/phase_2_multivariate_dspte/te_connectivity"
    phase_2_group:        "expert-novice/phase_2_multivariate_dspte/group"
    phase_2_statistics:   "expert-novice/phase_2_multivariate_dspte/statistics"
    phase_2_viz:          "expert-novice/phase_2_multivariate_dspte/visualizations"
    phase_3_connectivity: "expert-novice/phase_3_bimodal_dspte/te_connectivity"
    phase_3_group:        "expert-novice/phase_3_bimodal_dspte/group"
    phase_3_statistics:   "expert-novice/phase_3_bimodal_dspte/statistics"
    phase_3_viz:          "expert-novice/phase_3_bimodal_dspte/visualizations"
    phase_4_connectivity: "expert-novice/phase_4_amplitude_dste/te_connectivity"
    phase_4_group:        "expert-novice/phase_4_amplitude_dste/group"
    phase_4_statistics:   "expert-novice/phase_4_amplitude_dste/statistics"
    phase_4_viz:          "expert-novice/phase_4_amplitude_dste/visualizations"
    cross_phase:          "expert-novice/cross_phase_comparison"

    # Section 10 — Effective TE (ETE) + cross-method significance layer.
    # phase_4_ete_* populated now (10.4a/10.5/10.6 RUN NOW).
    # phase_2_ete_* directories created empty by the wiring (10.4b WIRE ONLY);
    # populated only once the deferred batch run (10.13 runbook) is triggered.
    phase_4_ete_connectivity: "expert-novice/phase_4_amplitude_dste/ete_connectivity"
    phase_4_ete_group:        "expert-novice/phase_4_amplitude_dste/ete_group"
    phase_4_ete_statistics:   "expert-novice/phase_4_amplitude_dste/ete_statistics"
    phase_4_ete_viz:          "expert-novice/phase_4_amplitude_dste/ete_visualizations"
    phase_2_ete_connectivity: "expert-novice/phase_2_multivariate_dspte/ete_connectivity"
    phase_2_ete_group:        "expert-novice/phase_2_multivariate_dspte/ete_group"
    phase_2_ete_statistics:   "expert-novice/phase_2_multivariate_dspte/ete_statistics"
    phase_2_ete_viz:          "expert-novice/phase_2_multivariate_dspte/ete_visualizations"
    gc_significance:          "expert-novice/gc_significance"
    cross_method_significance: "expert-novice/cross_method_significance"

    # Section 10.9-10.10 — Method-agnostic Asymmetry Index (AI) output dirs.
    # phase_4 / phase_4_raw / phase_4_ete AI tracks reuse existing dirs above
    # (phase_4_statistics, phase_4_viz, phase_4_ete_statistics, phase_4_ete_viz)
    # — only gc and phase_2 need new dirs since their AI results weren't
