    dummy_method_group:        "expert-novice/_dummy_method_10_12_proof/group"
    dummy_method_ai_statistics: "expert-novice/_dummy_method_10_12_proof/ai_statistics"
    dummy_method_ai_viz:       "expert-novice/_dummy_method_10_12_proof/ai_visualizations"

