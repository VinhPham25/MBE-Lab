    # code/stage_e_transfer_entropy/_dummy_method_10_12_proof.py.
    # Uses ONLY the pre-existing "symbolic_mean_npz" ai_loader.kind — zero
    # new code was added to 11_symbolic_ete_core.py, 12_asymmetry_index_core.py,
    # or 16_cross_method_significance.py to make this track work.
