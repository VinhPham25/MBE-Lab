    gc_ai_statistics:         "expert-novice/gc_significance/ai_statistics"
    gc_ai_viz:                "expert-novice/gc_significance/ai_visualizations"
    phase_2_ai_statistics:    "expert-novice/phase_2_multivariate_dspte/ai_statistics"
    phase_2_ai_viz:           "expert-novice/phase_2_multivariate_dspte/ai_visualizations"

    # Section 10.12 extensibility-proof scratch dirs (TEMPORARY — used only
