# ASTaUND Phase 1 - fNIRS Preprocessing Pipeline Configuration
# Created: 2026-01-18
# Reference: PROJECT.md Sections 2, 11, and throughout

# ==============================================================================
# DATASET SPECIFICATIONS
# ==============================================================================

datasets:
  expert_novice:
    name: "Expert-Novice"
    system: "TechEn_CW6"
    bids_task: "ExpNovPatternCutting"   # BIDS task label for output filenames
    output_folder: "expert-novice"      # Stage B processed data subfolder
    groups:
      Expert: ["A1", "A2", "R7", "R8", "R9", "R11", "R12"]
      Novice: ["R1", "R2", "R3", "R4", "R5", "R6"]
    sfreq: 25.0  # Hz (verified from actual data - 25 Hz, not 20 Hz as in PRD)
    wavelengths: [690, 830]  # nm
    n_long_channels: 25
    n_short_channels: 8
    ppf:  # Partial Path-length Factors
      690: 6.4
      830: 5.8
    coverage: ["PFC", "M1", "SMA"]
    n_subjects: 14
    subjects: ["A1", "A2", "R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R12"]
    data_path: "data/BIDS/Expert-Novice"
    
  learning_curve:
    name: "Learning-Curve"
    system: "TechEn_CW6"
    bids_task: "LearningCurve"
    output_folder: "learning-curve"
    sfreq: 20  # Hz
    wavelengths: [690, 830]  # nm
    n_long_channels: 25
    n_short_channels: 7  # Note: 7 instead of 8 due to hardware issues
    ppf:
      690: 6.4
      830: 5.8
    coverage: ["PFC", "M1", "SMA"]
    n_subjects: 13
    subjects: ["C1", "C2", "C3", "C4", "C5", "S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8"]
    data_path: "data/BIDS/Learning_Curve"
    
  short_term_tes:
    name: "Short-Term-tES"
    system: "NIRx_NIRScout"
    bids_task: "ShortTermtES"
    output_folder: "short-term-tES"
    sfreq: 7.8125  # Hz
    wavelengths: [760, 850]  # nm
    n_long_channels: 28
    n_short_channels: 8
    ppf:  # Placeholder — Section 3.9 will validate NIRx-specific PPF values
      760: 6.0
      850: 6.0
    coverage: ["PFC", "M1", "SMA"]
    n_subjects: 12
    subjects: ["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9", "S10", "S11", "S12"]
    data_path: "data/BIDS/Short-Term_tES"
    
  long_term_tes:
    name: "Long-Term-tES"
    system: "NIRx_NIRScout"
    bids_task: "LongTermtES"
    output_folder: "long-term-tES"
    sfreq: 7.8125  # Hz
    wavelengths: [760, 850]  # nm
    n_long_channels: 28
    n_short_channels: 8
    ppf:  # Placeholder — Section 3.9 will validate NIRx-specific PPF values
      760: 6.0
      850: 6.0
    coverage: ["PFC", "M1", "SMA"]
    n_subjects: 21
    groups:
      tDCS: ["tDCSL4", "tDCSL5", "tDCSL7", "tDCSL14", "tDCSL15", "tDCSL19", "tDCSL22"]
      tRNS: ["tRNSL2", "tRNSL9", "tRNSL10", "tRNSL13", "tRNSL17", "tRNSL21", "tRNSL23"]
      Sham: ["ShamL3", "ShamL6", "ShamL11", "ShamL18", "ShamL24", "ShamL25", "ShamL26"]
    data_path: "data/BIDS/Long-Term_tES"

# ==============================================================================
# STAGE A: RAW QUALITY ASSESSMENT PARAMETERS
# ==============================================================================

stage_a:
  # SNR (Signal-to-Noise Ratio) Thresholds
  snr:
    threshold_low: 80  # dB - minimum acceptable SNR
    threshold_high: 140  # dB - maximum acceptable SNR (saturation)
    formula: "20 * log10(mean / std)"  # SNR calculation on raw intensity
    
  # Motion Artifact Detection Parameters (from MATLAB code)
  motion:
    tMotion: 0.5  # Amplitude threshold
    STDEVthresh: 20  # Standard deviation multiplier
    AMPThresh: 0.5  # Amplitude threshold for motion detection
    STDEVthresh: 5  # Standard deviation threshold
    
  # Quality Gates for proceeding to Stage B
  quality_gates:
    min_channel_pass_rate: 0.70  # At least 70% of channels must pass SNR
    max_motion_ratio: 0.5  # Less than 50% motion artifacts
    
  # Output settings
  outputs:
    figures_dpi: 300  # High resolution for publication-quality figures
    bar_color: "white"
    bar_edge_color: "black"
    bad_channel_color: "red"
    threshold_line_color: "green"
    threshold_line_style: "--"

# ==============================================================================
# STAGE B: PREPROCESSING PIPELINE PARAMETERS
# ==============================================================================

stage_b:
  # Step B1: Intensity to Optical Density
  # Note: MNE computes OD = -log(I / mean(I)); per-channel mean OD ≈ 0 by construction.
  # Quality checks use std and NaN/Inf detection.
  optical_density:
    flat_std_threshold: 1.0e-5  # OD std below this → flat/dead channel (flag flat_signal)
    
  # Step B2: Bandpass Filtering (Homer3-equivalent: hmrR_BandpassFilt.m)
  # Low-pass:  3rd-order Butterworth, zero-phase filtfilt (always applied)
  # High-pass: 5th-order Butterworth, zero-phase filtfilt (skipped when hpf=0)
  # Homer3/paper default: hpf=0.000 → no high-pass; pure LPF at lpf=0.500 Hz
  filter:
    hpf: 0.0   # Hz - High-pass cutoff. 0.0 = no high-pass (Homer3 default)
    lpf: 0.5   # Hz - Low-pass cutoff (Homer3 default)
    
  # Step B3: Motion Artifact Detection (on OD)
  # Homer3 reference: hmrR_MotionArtifact.m
  # Audit fix (2026-03-05): max_diff padding corrected to MATLAB parity (zeros at END)
  # Parameter names match MATLAB function signatures for traceability.
  motion_detection:
    tMotion: 0.5        # Detection window width in seconds (Homer3 default: 0.5)
    STDEVthresh: 20     # Derivative-std multiplier for dual criterion (Homer3/ASTaUND: 20)
    AMPthresh: 5.0      # Absolute OD-change threshold in OD units (Homer3/ASTaUND: 5.0)
    t_mask: 0.5         # Temporal buffer around detected events in seconds (ASTaUND ref #36: 0.5)
    use_amp_only: true  # switched to amplitude-only to avoid derivative-threshold over-flagging of task structure
    
  # Step B4: Recursive PCA (rPCA) Motion Correction
  # Homer3 reference: hmrR_MotionCorrectPCArecurse.m + hmrR_MotionCorrectPCA.m
  # Audit fixes (reproduced_matlab_comparison.md §B4):
  #   4a — iterative: re-detect after each PCA pass, up to max_iterations
  #   4b — full-signal: motion subspace fitted on flagged segments, removed from ALL time points
  #   4c — OR-union mask: any channel flagged → that time point enters the mask (min_channels_flagged=1)
  #   4d — nSV=0.97 (Yucel et al. Homer3 default)
  rpca:
    n_components: 0.80       # nSV: reduced from 0.97 to limit over-removal during iterative rPCA
    max_iterations: 5        # Homer3 default maxIter: 5 (Yucel et al.)
    min_channels_flagged: 5  # require >=5 channels flagged to reduce over-aggressive correction mask
    
  # Step B5: Modified Beer-Lambert Law
  beer_lambert:
    # PPF values specified per dataset (see datasets section above)
    hb_range_min: -100  # μM - Flag if outside this range
    hb_range_max: 100   # μM - Flag if outside this range
    typical_range: 50   # μM - Typical task response range
    
  # Step B6: GLM/OLS HRF Deconvolution (Homer3 hmrS_GLM parity core)
  # Paper: HRF created via Gaussian basis functions + OLS, with short-channel nuisance regression
  short_channel_regression:
    method: "homer3_style_glm_ols"
    short_separation_threshold: 15  # mm - Channels < 15mm are short-separation
    trange: [-25, 100]                # seconds - HRF estimation window [t_pre, t_post] (Nemani-style constrained window)
    gaussian_std_s: 2.0             # seconds - Gaussian basis width (std)
    gaussian_step_s: 4.0            # seconds - spacing between Gaussian basis centers
    flag_nuisance_r_method: 2       # revert to max-correlation short-channel nuisance for stability
    drift_order: 3                  # restored best stable setting before code-level modification
    orthogonalize_drift_nuisance_against_hrf: False  # true=preserve HRsF variance by orthogonalizing drift/nuisance; false=legacy behavior
    glm_solve_method: 1             # 1 = OLS
    event_ids: [1]                  # annotation/event IDs used as stimulus onsets
    
  # Data Saving
  outputs:
    format: "fif"  # MNE-Python native format
    naming_convention: "{subject_id}_{dataset}_{session}_processed_raw.fif"

# ==============================================================================
# STAGE C: POST-PROCESSING VALIDATION PARAMETERS
# ==============================================================================

stage_c:
  # Step C1: HRF Extraction
  epochs:
    tmin: -25    # seconds before stimulus onset (baseline period)
    tmax: 100    # seconds after stimulus onset
    baseline: [-25, 0]  # Baseline correction period (seconds)
    event_id:
      trial_start: 1  # Condition 1 = trial start
      trial_end: 2    # Condition 2 = trial end
    
  # HRF Analysis
  hrf:
    expected_peak_time_min: 8   # seconds - Expected HRF peak window start
    expected_peak_time_max: 12  # seconds - Expected HRF peak window end
    peak_analysis_window: [5, 15]  # seconds - Window for extracting peak amplitude
    # Amplitude ranges for GROUP-MEAN region averages (after grand-averaging across subjects+channels)
    # Units: μM (mol/L × 1e6). Paper reports μM*mm (Homer3 convention) — numerically equivalent.
    # Single-channel per-subject peaks are ~5–15 μM; grand-average region means are ~0.01–0.50 μM.
    # See: AUDIT_PROGRESS.md Issue 6 (unit analysis, 2026-02-25)
    expected_hbo_amplitude: [0.01, 0.50]  # μM - group-mean region average HbO peak
    expected_hbr_amplitude: [0.01, 0.50]  # μM - group-mean region average HbR trough
    
  # Brain Region Channel Mapping
  # Note: Specific channel indices will be extracted from .snirf metadata
  brain_regions:
    PFC: "Prefrontal Cortex"
    M1: "Primary Motor Cortex"
    SMA: "Supplementary Motor Area"
    
  # Step C2: Contrast-to-Noise Ratio (CNR)
  cnr:
    formula: "abs(mu1 - mu2) / sqrt(sigma1^2 + sigma2^2)"
    peak_window: [5, 15]  # seconds - Window for extracting HRF peak
    threshold_detectable: 1.0  # CNR > 1.0 indicates detectable difference
    threshold_strong: 2.0      # CNR > 2.0 indicates strong separation
    
  # Step C3: Statistical Validation
  statistics:
    alpha: 0.05  # Significance level for hypothesis tests
    test_type: "two-tailed"  # Two-tailed t-test
    effect_size_metric: "cohen_d"
    meaningful_effect_size: 0.5  # Cohen's d > 0.5 is meaningful
    
  # Group Comparisons
  comparisons:
    expert_novice:
      - ["Expert", "Novice"]
    learning_curve:
      - ["Trainee", "Control"]
    long_term_tes:
      - ["Sham", "tDCS"]
      - ["Sham", "tRNS"]
      - ["tDCS", "tRNS"]
      
  # Visualization Settings
  visualization:
    hbo_color: "red"
    hbr_color: "blue"
    error_band_alpha: 0.3
    line_width: 2
    figure_dpi: 300

# ==============================================================================
# EVENT MARKERS
# ==============================================================================

events:
  condition_1: "trial_start"  # Trial onset
  condition_2: "trial_end"    # Trial offset
  
# ==============================================================================
# FILE PATHS
# ==============================================================================

paths:
  bids_root: "data/BIDS"
  raw_root: "data/Raw"
  processed_root: "outputs/stage_b_processed/processed_data"
  stage_a_outputs: "outputs/stage_a_qa"
  stage_b_outputs: "outputs/stage_b_processed"
  stage_c_outputs: "outputs/stage_c_validation"
  stage_d_outputs: "outputs/stage_d_granger"
  code_root: "code"
  
# ==============================================================================
# LOGGING AND DEBUGGING
# ==============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_logs: true
  log_dir: "outputs/logs"
  
debug:
  save_intermediate_outputs: true
  verbose: true
  plot_intermediate_steps: false  # Set to true for debugging

# ==============================================================================
# VALIDATION CRITERIA (Success Metrics)
# ==============================================================================

validation:
  stage_a:
    snr_mean_range: [90, 120]  # dB - Expected mean SNR range
    motion_ratio_range: [0.05, 0.25]  # Expected motion ratio range
    max_exclusion_rate: 0.30  # Maximum 30% of channels excluded
    
  stage_b:
    od_range: [0.1, 2.0]  # Valid optical density range
    hb_range: [-100, 100]  # μM - Valid hemoglobin concentration range
    
  stage_c:
    hrf_peak_time: [8, 12]  # seconds - Expected HRF peak timing
    hrf_amplitude_um: [0.01, 0.50]  # μM - group-mean region average (updated Issue 6)
    cnr_minimum: 1.0  # Minimum CNR for detectable group differences
    p_value_threshold: 0.05  # Significance threshold
    
# ==============================================================================
# REPRODUCIBILITY
# ==============================================================================

reproducibility:
  random_seed: 42
  save_processing_metadata: true
  track_software_versions: true
  
# ==============================================================================
# PERFORMANCE
# ==============================================================================

performance:
  n_jobs: -1  # Use all available CPU cores (-1)
  memory_efficient: true
  cache_preprocessing: false  # Set to true if reprocessing frequently
  
# ==============================================================================
# STAGE D: GRANGER CAUSALITY PARAMETERS
# ==============================================================================
# Reference: docs/LINEAR_GC_PROGRESS.md
# MATLAB reference: matlab_references/Linear GC/GC_freq_main_TRGC_NovExp.m

stage_d_granger:
  linear_gc:

    # --------------------------------------------------------------------------
    # Subject groups (R10 explicitly excluded — trailing-zero data quality flag;
    # anomalously high rPCA var_removed: HbO 87%, HbR 99%)
    # --------------------------------------------------------------------------
    subjects:
      Expert: ["A1", "A2", "R7", "R8", "R9", "R11", "R12"]   # n=7
      Novice: ["R1", "R2", "R3", "R4", "R5", "R6"]            # n=6
      excluded: ["R10"]   # data quality flag — do not process

    # --------------------------------------------------------------------------
    # ROI definitions (abbreviated keys matching build_region_map_5() output)
    # Full names: LPFC=Left Lateral PFC, CPFC=Central PFC, RPFC=Right Lateral
    # PFC, LM1=Left Medial M1, SMA=Supplementary Motor Area
    # --------------------------------------------------------------------------
    roi_names: ["LPFC", "CPFC", "RPFC", "LM1", "SMA"]

    # --------------------------------------------------------------------------
    # Sliding window parameters
    # MATLAB: window_size = 54*25 = 1350; Y(:,w-window_size:w) gives 1351
    # samples (MATLAB inclusive indexing). Python implementation replicates
    # this as Y[:, w-window_size : w+1] to match NL=1351 in cca_pwcausal.
    # --------------------------------------------------------------------------
    window:
      size_s: 54           # seconds — window duration
      sfreq: 25.0          # Hz — sampling rate (matches Stage B output)
      size_samples: 1350   # = size_s * sfreq (base; actual slice = 1351 incl.)
      stride_samples: 1350 # no overlap (sT = window_size in MATLAB)
      min_samples: 1350    # trials shorter than this have 0 windows (skipped)

    # --------------------------------------------------------------------------
    # VAR model parameters
    # MATLAB: cca_pwcausal(Y_windowed, 1, NL, 20, 20, freq, 1)
    # --------------------------------------------------------------------------
    var:
      order: 20            # model order (p) — both forward and backward in MATLAB
      stationarity_check: false  # ADF+differencing disabled: matches MATLAB cca_pwcausal (no pre-check)
      adf_pvalue_threshold: 0.05 # non-stationary if p > threshold

    # --------------------------------------------------------------------------
    # Frequency-domain GC parameters
    # MATLAB: freq = [0:0.01:0.1] → 11 frequency points
    # --------------------------------------------------------------------------
    frequency:
      f_start: 0.0         # Hz — start of GC frequency vector
      f_stop: 0.1          # Hz — end (inclusive)
      f_step: 0.01         # Hz — step size → 11 points: [0, 0.01, ..., 0.10]
      n_freqs: 11          # = len(np.arange(0, 0.11, 0.01))

    # --------------------------------------------------------------------------
    # Neurophysiological band averaging
    # MATLAB: idx1 = find(freq==0.01); idx2 = find(freq==0.07)
    #         mean(GW(:,:,idx1:idx2), 3)
    # --------------------------------------------------------------------------
    band_avg:
      f_low: 0.01          # Hz — lower bound of hemodynamic band
      f_high: 0.10         # Hz — upper bound

    # --------------------------------------------------------------------------
    # Signal units note
    # MNE stores hemoglobin in mol/L (not μM). GC is computed on raw mol/L
    # values — the log-ratio formulation is unit-agnostic. No conversion applied.
    # --------------------------------------------------------------------------
    signal_units: "mol/L"  # MNE native; GC is unit-agnostic (log-ratio)

    # --------------------------------------------------------------------------
    # Output paths (relative to stage_d_outputs = outputs/stage_d_granger)
    # --------------------------------------------------------------------------
    output_subdirs:
      roi_signals:    "linear_gc/expert-novice/roi_signals"
      gc_raw:         "linear_gc/expert-novice/gc_raw"
      gc_connectivity: "linear_gc/expert-novice/gc_connectivity"
      group:          "linear_gc/expert-novice/group"
      statistics:     "linear_gc/expert-novice/statistics"
      visualizations: "linear_gc/expert-novice/visualizations"

    # --------------------------------------------------------------------------
    # Statistical testing parameters (Section 6)
    # Mirrors MATLAB: swtest → shapiro, anova1 → f_oneway, mafdr → fdrcorrection
    # --------------------------------------------------------------------------
    statistics:
      fdr_method: "indep"       # statsmodels fdrcorrection method ('indep' = BH)
      alpha: 0.05               # significance threshold after FDR correction
      n_connections: 20         # off-diagonal elements of 5×5 GC matrix
      min_subjects_normality: 3 # minimum valid subjects to run Shapiro-Wilk (scipy needs n>=3)
      min_subjects_anova: 3     # minimum valid subjects per group to run f_oneway
      min_groups_anova: 2       # minimum non-empty groups to run f_oneway (H0, HIV)

      # H1: Expert vs. Novice — MATLAB runs only Tr_1 but we run all trials
      h1_primary_trial: "Tr_1"  # trial used for primary H1 inference (matches MATLAB 'for k=1:1')

      # H0: Within-trial stability — zero/NaN filter from MATLAB
      # If > max_nan_subjects subjects have NaN in connection[0] of window j, truncate
      h0_max_nan_subjects: 2    # MATLAB: zer_col > 2 → stop; Python: nan_count > 2 → stop
      h0_check_connection_idx: 0 # connection index to check for NaN (MATLAB: connection 1 = idx 0)

      # HIV: Across-trial stability — MATLAB loops j = 1:3 (first 3 windows only)
      hiv_max_windows: 3        # number of windows to test across trials (MATLAB: j = 1:3)
      hiv_min_trials: 2         # minimum trials with valid data to run across-trial ANOVA

# ==============================================================================
# STAGE E: TRANSFER ENTROPY PARAMETERS
# ==============================================================================
# Reference: docs/TRANSFER_ENTROPY_PROGRESS.md
# Papers:
#   Wang (2020) — dSPTE: doi:10.1088/1741-2552/abb4a4
#   Wang (2022) — MTENUE: doi:10.1016/j.bspc.2021.103422

stage_e_transfer_entropy:

  # --------------------------------------------------------------------------
  # Output paths (relative to project root)
  # --------------------------------------------------------------------------
  paths:
    output_root: "outputs/stage_e_transfer_entropy"

  # --------------------------------------------------------------------------
  # Subject groups (R10 excluded — same reason as Stage D)
  # Note: capitalisation matches Stage D convention (Expert / Novice)
  # --------------------------------------------------------------------------
  subjects:
    Expert: ["A1", "A2", "R7", "R8", "R9", "R11", "R12"]   # n=7
    Novice: ["R1", "R2", "R3", "R4", "R5", "R6"]            # n=6
    excluded: ["R10"]   # data quality flag — trailing zeros, anomalous rPCA

  # --------------------------------------------------------------------------
  # Signal processing parameters
  # --------------------------------------------------------------------------
  signal:
    sfreq: 25.0                           # Hz (R9 resampled from 50 Hz in-memory)
    embedding_dimension: 2                # d — Wang (2020) standard for fNIRS phase-TE
    embedding_delay_method: "autocorr_1_over_e"  # lag where ACF first drops below 1/e ≈ 0.368
    u_max: 300                             # maximum lag for multi-delay search (50 samples = 2 s at 25 Hz)

  # --------------------------------------------------------------------------
  # Narrowband pre-filter (Option A: full-trial filter → Hilbert → window)
  # Applied to the entire trial signal BEFORE phase extraction and windowing.
  # Converts the broadband HbO signal into a quasi-monocomponent oscillation
  # so that instantaneous Hilbert phase is physically meaningful.
  #
  # Two validated bands:
  #   Wang  (2020): f_lo=0.01, f_hi=0.10  — slow hemodynamic oscillations
  #     ⚠ Requires ≥270 s trial (≥2.7 cycles at 0.01 Hz). Expert trials (~270 s)
  #       give ~2.7 cycles; Novice trials (~480 s) give ~4.8 cycles.
  #   Lobier(2014): f_lo=0.04, f_hi=0.15  — faster hemodynamic fluctuations
  #     ✓ Safer for shorter recordings; 25 s period → ~11 cycles in 270 s.
  #
  # Set enabled: false to disable filtering and revert to broadband (legacy) mode.
  # --------------------------------------------------------------------------
  narrowband_filter:
    enabled: true
    apply_to_phase: true   # Phase branch toggle (default: true when enabled)
    apply_to_amplitude: false  # Amplitude branch toggle (default: false; use raw HbO amplitude)
    f_lo: 0.01      # Hz — high-pass cutoff (Lobier 2014 default; change to 0.01 for Wang 2020)
    f_hi: 0.10      # Hz — low-pass  cutoff (Lobier 2014 default; change to 0.10 for Wang 2020)
    order: 3        # Butterworth order (effective order = 2×order after zero-phase filtfilt)

  # --------------------------------------------------------------------------
  # Sliding window parameters (identical to Stage D)
  # MATLAB: window_size=54*25=1350; Y(:,w-window_size:w) → 1351 samples inclusive
  # --------------------------------------------------------------------------
  window:
    size_s: 54             # seconds
    size_samples: 1350     # = size_s * sfreq
    stride_samples: 1350   # no overlap
    min_samples: 1350      # trials shorter than this skipped

  # --------------------------------------------------------------------------
  # Neural-Gas symbolisation parameters
  # Wang (2020) Eq. 11 — nDis threshold for optimal codebook size k₀
  # --------------------------------------------------------------------------
  symbolisation:
    ndis_threshold: 0.05           # 5% — Wang (2020) Section 3.2
    k0_min: 2                      # minimum codebook size to test
    k0_max_bivariate: 35           # guard against codebook explosion (bivariate)
    k0_max_multivariate: 4         # sample-scarcity guard for 4D+ contingency tables (Phase 2); at k₀=3: 3⁴=81 cells → ~16.5 samp/cell at T'≈1341
    ng_max_iterations: 500         # Neural-Gas training iterations per k
    ng_learning_rate_i: 0.5        # initial learning rate λ_i
    ng_learning_rate_f: 0.01       # final learning rate λ_f
    ng_neighbourhood_i: 10.0       # initial neighbourhood width σ_i
    ng_neighbourhood_f: 0.1        # final neighbourhood width σ_f

  # --------------------------------------------------------------------------
  # Statistical testing parameters (Section 5)
  # Mirrors Stage D stage_d_granger.linear_gc.statistics exactly.
  # --------------------------------------------------------------------------
  statistics:
    fdr_method: "indep"           # statsmodels fdrcorrection method ('indep' = BH)
    alpha: 0.05                   # significance threshold after FDR correction
    n_connections: 20             # off-diagonal elements of 5×5 TE matrix
    min_subjects_normality: 3     # minimum valid subjects to run Shapiro-Wilk
    min_subjects_anova: 3         # minimum valid subjects per group to run f_oneway
    min_groups_anova: 2           # minimum non-empty groups to run f_oneway (H0, HIV)

    # H1: Expert vs. Novice — primary trial (matches MATLAB 'for k=1:1')
    h1_primary_trial: "Tr_1"

    # H0: Within-trial stability — NaN filter (mirrors Stage D / MATLAB zer_col > 2 logic)
    h0_max_nan_subjects: 2        # if > 2 subjects NaN in check connection → truncate
    h0_check_connection_idx: 0    # connection index to check for NaN

    # HIV: Across-trial stability — first 3 windows only (MATLAB: j = 1:3)
    hiv_max_windows: 3
    hiv_min_trials: 2             # minimum trials with valid data to run ANOVA

  # --------------------------------------------------------------------------
  # Group comparison strategy — controls trial-duration confound fix
  # Novice subjects have longer trials (~16 windows) vs Experts (~6 windows).
  # Subject-averaging gives each subject equal weight for H1 Expert vs Novice.
  # --------------------------------------------------------------------------
  comparison:
    primary_strategy: "subject_mean"    # used for H1 Expert vs Novice
    sensitivity_strategy: "first_window"  # sensitivity check for H1
    # subject_mean:  average all windows per subject per trial → 1 value per sub per trial
    # first_window:  use only Win_1 per trial per subject
    # all_windows:   all windows NaN-padded (used for H0/HIV only)

  # --------------------------------------------------------------------------
  # Phase 2 — Multivariate dSPTE (Multivariate Conditioning) parameters
  # See TRANSFER_ENTROPY_PROGRESS.md Section 7.1 for design rationale.
  # --------------------------------------------------------------------------
  phase_2:
    # Sparsity guard for conditional TE (Section 7.2.1).
    # If > sparsity_fallback_threshold fraction of cells are zero in the
    # (n+2)-dimensional contingency table, fall back to bivariate dSPTE for
    # that pair at that lag. Log fallback count per window.
    sparsity_fallback_threshold: 0.95   # Ex: 80% zero cells → fallback to Phase 1

    # τ divergence check (Section 7.1.1).
    # If max(τ) > tau_divergence_ratio × min(τ) across ROIs, emit a WARNING.
    # The narrowband filter (0.04–0.15 Hz) should homogenise τ across ROIs
    # to within ~2× — larger divergence suggests the filter is not fully
    # stabilising phase structure.
    tau_divergence_ratio: 2.0

    # Symbol entropy degenerate threshold (Section 7.1.1) in nats.
    # ROIs with H(S_roi) < degenerate_entropy_threshold are flagged as
    # degenerate: their TE estimates will be unreliable (H ≈ 0 → all samples
    # map to one symbol → TE ≈ 0 regardless of coupling).
    # Maximum possible entropy at k₀=4 is log(4) ≈ 1.386 nats.
    degenerate_entropy_threshold: 1.0   # nats

    # --------------------------------------------------------------------------
    # PCA Conditioning Compression (toggleable — resolves 6D sparsity problem)
    #
    # When conditional_pca.enabled = true, the n_z=3 conditioning channels are
    # compressed to n_components PCA components before symbolisation. The PCA
    # is applied to the stacked time-delay embedded phase matrices of the
    # conditioning channels ((T', n_z × d) → (T', n_components)).
    # The result is symbolised via the shared NG codebook → single composite
    # conditioner → 4D contingency table (256 cells, ~5.2 samp/cell).
    #
    # When enabled = false: full n_z=3 conditioning is used → 6D table (4096
    # cells, ~0.33 samp/cell) → effectively always triggers sparsity fallback.
    #
    # Trade-off: PCA captures dominant linear shared variance but misses
    # nonlinear interactions between conditioning channels. If PC1 explains
    # < min_explained_var_warning_pct of variance, a WARNING is logged.
    # --------------------------------------------------------------------------
    conditional_pca:
      enabled: true           # toggle PCA compression on/off
      n_components: 1         # 1 → 4D table (256 cells); 2 → 5D table (1024 cells)
      min_explained_var_warning_pct: 60   # warn if PC1 explains < 60% variance

    # Output paths (relative to output_root/expert-novice/)
    batch_log_filename: "multivariate_te_batch_log.json"
    window_slow_threshold_s: 120    # warn if a single window takes longer than this (seconds)

  # --------------------------------------------------------------------------
  # Phase 3 — Bimodal fusion parameters
  # --------------------------------------------------------------------------
  phase_3:
    fusion_mode: "fixed"    # "fixed" = use weights below; "optimise" = PSO on training windows
    w_phase: 0.3            # weight for phase-branch TE
    w_amplitude: 0.7        # weight for amplitude-branch TE

  # --------------------------------------------------------------------------
  # Phase 4 — Multivariate conditional amplitude dSTE parameters
  #
  # Novel contribution: replaces the phase component entirely with the Hilbert
  # amplitude envelope of broadband (unfiltered) HbO signals.  The shared
  # Neural-Gas codebook is fit on amplitude delay embeddings; multivariate
  # conditioning (PCA-compressed) suppresses indirect connections.
  #
  # k₀ analysis for amplitude data (Hilbert envelope, z-scored, d=2):
  #   nDis floor for uniform data: nDis_floor(k, d=2) = 0.5/k
  #   → k=10 reaches nDis=0.05 exactly for uniform 2D data
  #   Amplitude data is NOT quasi-uniform (HRF clustering); convergence
  #   expected at k₀=5–10.  k0_max=20 allows the NG to find the natural
  #   convergence point (no need to raise higher — d=2 is much better than
  #   the d=3 phase case that required k0_max=35).
  #
  # Contingency table sparsity limits (T'≈1343 samples/window):
  #   Bivariate 3D: k₀=6 → 216 cells → ~6.2 samp/cell  (adequate ≥5 ✓)
  #   Conditional 4D (PCA 1PC): k₀=4 → 256 cells → ~5.2 samp/cell  ✓
  #                              k₀=5 → 625 cells → ~2.1 samp/cell  ✗
  # The sparsity fallback fires automatically when the 4D table is too dense;
  # no hard pre-clamp is applied in Phase 4 (unlike Phase 2's forced k₀=4).
  # --------------------------------------------------------------------------
  phase_4:
    # NG codebook search ceiling for amplitude data.
    #
    # The binding constraint is the 4D conditional contingency table (after PCA
    # compression to 1 PC).  At T'≈1350 samples/window:
    #   k₀=4 → 4⁴=256 cells  → ~5.3 samp/cell  ✓ (adequate ≥5)
    #   k₀=5 → 5⁴=625 cells  → ~2.2 samp/cell  ✗ (sparse → fallback)
    #   k₀=6 → 6⁴=1296 cells → ~1.0 samp/cell  ✗ (catastrophic sparsity)
    #
    # With k0_max=20, amplitude NG converges at k₀≈20 (nDis floor=0.025<0.05),
    # giving 20⁴=160,000 cells → 99.8% empty → sparsity fallback fires on every
    # lag of every pair → multivariate conditioning never activates.
    #
    # Set to 4 (matching symbolisation.k0_max_multivariate for Phase 2) so the
    # conditional 4D table stays tractable.  nDis will be ~0.125 at k₀=4
    # (above the 0.05 threshold), meaning the NG is stopped early by the ceiling
    # rather than by convergence — this is intentional and identical to Phase 2's
    # design.  Bivariate 3D table at k₀=4: 64 cells → ~21 samp/cell ✓.
    # Set k0_max to 20 for Phase 4 branch only, set k0_max to 4 for Phase 2/3 branch
    k0_max: 4                   # conditional 4D table constraint: k₀=4 → 256 cells → ~5.3 samp/cell ✓

    ndis_threshold: 0.05        # Wang (2020) Eq. 11 convergence criterion (5%)

    # Envelope preprocessing: z-score each ROI's amplitude per window.
    # Normalises HRF magnitude differences across windows and subjects,
    # ensuring the shared NG codebook captures shape rather than scale.
    # Strongly recommended; set false only for diagnostic comparisons.
   
    envelope_normalize: true

    # PCA conditioning compression:
    # Compresses n_z=3 conditioning ROIs to 1 PC before symbolisation.
    # Result: 4D contingency table (k₀^4 cells) instead of 6D (k₀^6 cells).
    # At k₀=4: 256 cells → ~5.2 samples/cell (adequate threshold ≥5).
    conditional_pca:
      enabled: true
      n_components: 1           # 1 → 4D table; increase to 2 only if T' > 3000
      min_explained_var_warning_pct: 60  # warn if PC1 < 60% amplitude embedding variance

    # Sparsity fallback threshold (fraction of zero cells in conditional table).
    # Mirrors phase_2.sparsity_fallback_threshold.  When exceeded, the pair
    # falls back to bivariate amplitude TE (Phase 3 amplitude branch logic).
    sparsity_fallback_threshold: 0.95

    # Minimum samples per occupied cell in the conditional table.
    # Used for the mean_count_occupied diagnostic log; does not trigger fallback
    # (the sparsity_fallback_threshold above controls fallback logic).
    min_samples_per_cell: 5

    # Symbol entropy threshold below which an ROI's symbolic sequence is
    # flagged as degenerate (all samples mapping to ≤2 codewords).
    # Degenerate sequences produce TE ≈ 0 regardless of true coupling.
    # For amplitude data, max entropy at k₀=8 is log(8)=2.08 nat;
    # threshold 1.0 nat is equivalent to ~30% of max — a conservative guard.
    degenerate_entropy_threshold: 1.0

    # τ divergence check: warn if max(τ)/min(τ) exceeds this ratio across ROIs.
    # For broadband amplitude, τ (HRF decorrelation time) should be similar
    # across ROIs (~100–250 samples at 25 Hz).  Values > 3× signal issues.
    tau_divergence_ratio: 3.0

    # ------------------------------------------------------------------------
    # Section 10 — Effective TE (ETE) surrogate parameters.
    # phase_2.ete (added when 10.4b is activated) should default to these same
    # values pending review — see the "Deferred Work Runbook" at the end of
    # TRANSFER_ENTROPY_PROGRESS.md Section 10.
    #
    # Design (TRENTOOL / Lindner et al. circular-shift convention):
    #   ETE = TE_raw - mean(TE_surrogate_null)
    # The lag u_opt is FIXED from the real-data multidelay search (not
    # re-searched per surrogate) — this is the standard surrogate-testing
    # convention: it avoids the upward bias that re-maximising over u_max
    # independent lags on every one of 500 null realisations would introduce.
    # ------------------------------------------------------------------------
    ete:
      n_surrogates: 500              # circular-shift surrogates per pair per window
      surrogate_method: "circular_shift"
      min_shift_fraction: 0.05       # min |shift| as a fraction of T' (avoids near-zero shifts that leave S_x nearly unchanged)
      fixed_lag_from_raw: true       # u_opt taken from the real-data delay_matrix, never re-searched per surrogate
      floor_estimator: "mean"        # null floor = mean(null_distribution); alternative: "median"
      clip_negative: false           # ETE stays signed (negative ETE is informative: raw TE was AT or BELOW the chance floor)
      p_value_alternative: "greater" # one-sided: fraction of null >= raw_te
      random_seed_base: 42           # per (subject, trial, window, pair) seed = base + deterministic offset (see 11_symbolic_ete_core.py)

  # --------------------------------------------------------------------------
  # IDTxl validation parameters (Section 7.4)
  # These are read by run_idtxl_multivariate_te() and can all be overridden
  # via CLI flags without touching this file.
  #
  # Speed guide (per IDTxl call on T=1350, 5 ROIs, 25 Hz fNIRS):
  #   max_lag_sources=10, kraskov_k=4, n_perm=50   → ~30–60 min/call
  #   max_lag_sources=3,  kraskov_k=2, n_perm=21   → ~3–8 min/call  ← fast mode
  #
  # With --first-trial-only (1 call total for --subject):
  #   fast mode → ~3–8 min total for a single-subject cross-check
  # --------------------------------------------------------------------------
  idtxl_validation:
    max_lag_sources: 10       # samples; override with --idtxl-max-lag (use 3 for fast mode)
    max_lag_target: 10        # samples; auto-clamped to max_lag_sources if larger
    kraskov_k: 4              # KNN neighbours; override with --idtxl-knn (use 2 for fast mode)
    n_perm_max_stat: 50       # permutations; override with --idtxl-n-perm or --idtxl-fast
    n_perm_min_stat: 50
    n_perm_omnibus: 100
    n_perm_max_seq: 50
    num_threads: "USE_ALL"    # passed to IDTxl settings; effect depends on estimator

  # --------------------------------------------------------------------------
  # SECTION 10 — Effective Transfer Entropy (ETE) & Extensible Cross-Method
  # Significance Layer.  See TRANSFER_ENTROPY_PROGRESS.md Section 10 for the
  # full design rationale (Marschinski & Kantz 2002 for ETE; Geweke 1982 for
  # the GC-native analytic equivalent).
  #
  # Method registry — the whole point of this block is that a 4th method
  # (real or synthetic — see 10.12's extensibility proof) should be addable
  # by appending ONE entry here plus one small loader function, with ZERO
  # changes to 11_symbolic_ete_core.py, 12_asymmetry_index_core.py, or
  # 16_cross_method_significance.py.
  #
  # Fields:
  #   label                       — human-readable name for tables/figures
  #   kind                        — "symbolic_te" (NG-symbolic, has raw_matrix_fn
  #                                  + can run ETE) or "gc" (continuous VAR/
  #                                  frequency-domain, analytic significance only)
  #   raw_matrix_fn                — "module_path:function" for the raw compute_*
  #                                  callback (symbolic methods only; null for gc)
  #   has_ete                      — bool, whether a surrogate-based ETE track exists
  #   has_analytic_significance    — bool, whether a Geweke-style analytic test exists
  #   connectivity_dir / group_dir — output_subdirs keys for this method's raw outputs
  #                                  (null → resolved via Stage D's own utils_gc
  #                                  output_subdirs instead, for kind: "gc")
  #   ete_connectivity_dir/ete_group_dir — output_subdirs keys for ETE outputs
  #                                  (symbolic methods only)
  #   significance_dir              — output_subdirs key for analytic-significance
  #                                  outputs (gc only)
  #   executed_raw                 — bool, has the raw connectivity actually been
  #                                  batch-computed? (updated as tasks complete)
  #   executed_ete_or_significance — bool, has ETE / Geweke actually been run?
  #                                  (updated as tasks complete — see the runbook)
  # --------------------------------------------------------------------------
  # ai_loader / ai_track / ai_stats_dir / ai_viz_dir (added 10.9-10.10):
  # power the method-agnostic Asymmetry Index core (12_asymmetry_index_core.py).
  #   ai_loader.kind   — "symbolic_mean_npz" (load a pre-built B_{Exp,Nov}
  #                       subject-mean .npz pair straight off disk — the
  #                       generic case, covers raw TE/dSTE/dSPTE AND ETE
  #                       tracks alike since both are already-materialized
  #                       (n_subs, 20, n_trials) mean arrays) or
  #                       "gc_windowed" (GC group arrays are per-window,
  #                       shape (n_subs, 20, n_windows) per trial key, and
  #                       need trial-averaging before use — the one place
  #                       GC's on-disk schema differs from the symbolic
  #                       methods').  Adding a new symbolic method (10.12)
  #                       requires zero new loader code, only a new
  #                       "symbolic_mean_npz" entry below.
  #   ai_track          — true → included in run_ai_all_methods()'s loop.
  #                        false → registered for other purposes (raw
  #                        connectivity, ETE, Geweke) but not looped as its
  #                        own AI track (used for the "phase_4" alias, which
  #                        exists only so 18_asymmetry_index_statistics.py's
  #                        legacy CLI keeps working — its actual AI track is
  #                        "phase_4_raw", identical data, explicit name).
  #   ai_stats_dir/ai_viz_dir — output_subdirs keys for this track's AI CSVs
  #                        /figures.
  significance_methods:
    gc:
      label: "Stage D Linear GC"
      kind: "gc"
      raw_matrix_fn: null
      has_ete: false
      has_analytic_significance: true
      connectivity_dir: null            # resolved via stage_d_granger.utils_gc.get_gc_output_dir("gc_connectivity")
      group_dir: null                   # resolved via stage_d_granger.utils_gc.get_gc_output_dir("group")
      significance_dir: "gc_significance"
      executed_raw: true                 # Stage D GC batch already computed (Section 4)
      executed_ete_or_significance: false  # 13_gc_significance.py is WIRE ONLY this pass (10.7)
      ai_loader:
        kind: "gc_windowed"
      ai_track: true
      ai_stats_dir: "gc_ai_statistics"
      ai_viz_dir: "gc_ai_viz"
      h1_loader:
        kind: "stage_d_csv"
        dir_key: "statistics"
        filename: "H1_expert_vs_novice.csv"

    phase_2:
      label: "Phase 2 — Multivariate dSPTE (phase)"
      kind: "symbolic_te"
      raw_matrix_fn: "phase_2/06_multivariate_dspte.py:compute_multivariate_dspte_matrix"
      has_ete: true
      has_analytic_significance: false
      connectivity_dir: "phase_2_connectivity"
      group_dir: "phase_2_group"
      ete_connectivity_dir: "phase_2_ete_connectivity"
      ete_group_dir: "phase_2_ete_group"
      executed_raw: true                 # raw multivariate dSPTE already batch-computed (Section 7.2.3/7.3.1)
      executed_ete_or_significance: false  # phase_2/12_multivariate_ete.py is WIRE ONLY this pass (10.4b)
      ai_loader:
        kind: "symbolic_mean_npz"
        group_dir: "phase_2_group"
        exp_filename: "B_Exp_multivariate_mean.npz"
        nov_filename: "B_Nov_multivariate_mean.npz"
      ai_track: true
      ai_stats_dir: "phase_2_ai_statistics"
      ai_viz_dir: "phase_2_ai_viz"
      h1_loader:
        kind: "output_subdir_csv"
        dir_key: "phase_2_statistics"
        filename: "H1_expert_vs_novice.csv"

    phase_4:
      label: "Phase 4 — Multivariate Conditional Amplitude dSTE"
      kind: "symbolic_te"
      raw_matrix_fn: "phase_4/14_amplitude_dste.py:compute_amplitude_conditional_dste_matrix"
      has_ete: true
      has_analytic_significance: false
      connectivity_dir: "phase_4_connectivity"
      group_dir: "phase_4_group"
      ete_connectivity_dir: "phase_4_ete_connectivity"
      ete_group_dir: "phase_4_ete_group"
      executed_raw: true                 # raw amplitude dSTE already batch-computed (Section 9)
      executed_ete_or_significance: false  # flip to true once 10.5's batch run completes
      # Backward-compat alias only (18_asymmetry_index_statistics.py's legacy
      # CLI calls run_ai_for_method("phase_4", ...)) — identical data/dirs to
      # "phase_4_raw" below.  ai_track: false so run_ai_all_methods() doesn't
      # double-count it alongside "phase_4_raw".
      ai_loader:
        kind: "symbolic_mean_npz"
        group_dir: "phase_4_group"
        exp_filename: "B_Exp_amplitude_mean.npz"
        nov_filename: "B_Nov_amplitude_mean.npz"
      ai_track: false
      ai_stats_dir: "phase_4_statistics"
      ai_viz_dir: "phase_4_viz"

    phase_4_raw:
      label: "Phase 4 — Amplitude dSTE (raw magnitude)"
      kind: "symbolic_te"
      has_ete: false
      has_analytic_significance: false
      ai_loader:
        kind: "symbolic_mean_npz"
        group_dir: "phase_4_group"
        exp_filename: "B_Exp_amplitude_mean.npz"
        nov_filename: "B_Nov_amplitude_mean.npz"
      ai_track: true
      ai_stats_dir: "phase_4_statistics"
      ai_viz_dir: "phase_4_viz"
      h1_loader:
        kind: "output_subdir_csv"
        dir_key: "phase_4_statistics"
        filename: "H1_expert_vs_novice.csv"

    phase_4_ete:
      label: "Phase 4 — Amplitude dSTE (ETE, floor-corrected)"
      kind: "symbolic_te"
      has_ete: false
      has_analytic_significance: false
      ai_loader:
        kind: "symbolic_mean_npz"
        group_dir: "phase_4_ete_group"
        exp_filename: "B_Exp_ete_mean_ete_connectivity.npz"
        nov_filename: "B_Nov_ete_mean_ete_connectivity.npz"
      ai_track: true
      ai_stats_dir: "phase_4_ete_statistics"
      ai_viz_dir: "phase_4_ete_viz"
      h1_loader:
        kind: "output_subdir_csv"
        dir_key: "phase_4_ete_statistics"
        filename: "ete_H1_expert_vs_novice.csv"

    # --------------------------------------------------------------------
    # TEMPORARY TEMPLATE — Section 10.12 extensibility proof. Registered, run, and
    # verified (see TRANSFER_ENTROPY_PROGRESS.md's 10.12 result note for the
    # captured log evidence), then this entry + its scratch output dirs were
